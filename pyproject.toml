[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-forge"
version = "1.0.0"
description = "Production-grade visual asset pipeline for raster, vector, 3D, runtime atlases, and engine handoff."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "License terms are defined by the repository owner."}
authors = [{name = "dbrckk"}]
dependencies = []

[project.optional-dependencies]
webp = ["Pillow>=12.2,<13"]
generation = ["Pillow>=12.2,<13", "rembg[cpu,cli]", "vtracer>=0.6,<2"]
dev = ["Pillow>=12.2,<13"]

[project.scripts]
asset-forge = "asset_forge:main"

[tool.setuptools]
packages = ["config", "pipelines", "profiles", "schemas"]
py-modules = [
  "animation_infer",
  "art_quality",
  "asset_forge",
  "asset_library",
  "asset_profile_validation",
  "blender_adapter",
  "backend_history",
  "colab_queue",
  "cloudflare_backend",
  "engine_profile_validation",
  "generator_backends",
  "gltf_binary_metrics",
  "gltf_diagnostics",
  "gltf_quality",
  "kaggle_backend",
  "kaggle_3d_backend",
  "lod_3d",
  "gltf_tools",
  "godot_3d_delivery",
  "godot_export",
  "godot_handoff",
  "operational_status",
  "production_contract",
  "production_executor",
  "qwen_colab_worker",
  "raster_backend",
  "raster_pack",
  "remote_batch",
  "runtime_atlas",
  "semantic_art_review",
  "runtime_3d_plan",
  "starlist_bridge",
  "svg_tools",
  "toolchain_3d",
  "visual_similarity",
  "vector_backend",
]


[tool.setuptools.package-data]
config = ["*.json"]
pipelines = ["*.json"]
profiles = ["**/*.json"]
schemas = ["*.json"]
