name: Kaggle Qwen Readiness One-Shot
on:
  push:
    branches: [probe/kaggle-qwen-readiness-20261010]
    paths: ['.github/workflows/kaggle-qwen-readiness-one-shot.yml']
permissions:
  contents: read
concurrency:
  group: kaggle-qwen-readiness-20261010
  cancel-in-progress: false
jobs:
  readiness-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Checkout exact proposed Asset Forge code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CLI without image models or GPU use
        run: |
          python -m pip install --no-deps -e .
          python -m pip install -U kaggle
      - name: Check read-only API and record booleans only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from kaggle_backend import status
          from generator_backends import select_generation_backend, GenerationError
          s = status()
          report = {
              "schema": "asset-forge/kaggle-qwen-readiness/v1",
              "cliInstalled": s.get("installed") is True,
              "credentialsConfigured": s.get("authenticated") is True,
              "rasterReadyByConfig": s.get("rasterReady") is True,
              "readOnlyApiAuthenticated": False,
              "strictAutoSelectsQwen": False,
              "modelLoadValidated": False,
              "gpuAllocationValidated": False,
              "realGenerationValidated": False,
          }
          request = json.loads(Path("examples/production-request-strict-raster.json").read_text())
          job = {
              "assetType": request["manifest"]["type"],
              "instruction": request["instruction"],
              "manifest": request["manifest"],
          }
          try:
              report["strictAutoSelectsQwen"] = select_generation_backend(job, "auto") == "kaggle-qwen"
          except GenerationError:
              pass
          if report["rasterReadyByConfig"]:
              try:
                  result = subprocess.run(
                      ["kaggle", "kernels", "list", "--mine", "--page-size", "1"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                      timeout=45,
                  )
                  report["readOnlyApiAuthenticated"] = result.returncode == 0
              except (OSError, subprocess.TimeoutExpired):
                  pass
          report["readyForBoundedAttempt"] = (
              report["rasterReadyByConfig"]
              and report["readOnlyApiAuthenticated"]
              and report["strictAutoSelectsQwen"]
          )
          Path("build").mkdir(exist_ok=True)
          Path("build/kaggle-readiness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Preserve non-secret decision only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaggle-qwen-readiness-20261010
          path: build/kaggle-readiness.json
          if-no-files-found: warn
          retention-days: 7
