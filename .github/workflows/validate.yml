name: Validate asset-forge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Asset Forge CLI
        run: python -m pip install --no-deps -e .
      - name: Smoke-test installed CLI
        run: asset-forge --help >/dev/null
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w build/wheel
      - name: Smoke-test wheel resources
        run: |
          python -m venv build/wheel-venv
          build/wheel-venv/bin/python -m pip install --no-deps build/wheel/*.whl
          (
            cd /tmp
            "$GITHUB_WORKSPACE/build/wheel-venv/bin/asset-forge" validate-engine-profiles
            "$GITHUB_WORKSPACE/build/wheel-venv/bin/asset-forge" validate-asset-profiles
          )
      - name: Compile
        run: python -m compileall -q backend_history.py asset_forge.py raster_pack.py raster_backend.py runtime_atlas.py godot_export.py godot_3d_delivery.py godot_handoff.py engine_profile_validation.py asset_profile_validation.py starlist_bridge.py animation_infer.py svg_tools.py vector_backend.py gltf_tools.py gltf_quality.py gltf_binary_metrics.py gltf_diagnostics.py kaggle_3d_backend.py blender_adapter.py toolchain_3d.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example manifest
        run: python asset_forge.py validate examples/asset-manifest.json
      - name: Build example plan
        run: python asset_forge.py plan examples/asset-manifest.json
      - name: Compile Production OS asset request
        run: python asset_forge.py production-job examples/production-request.json --output build/production-job.json
      - name: Inspect generator backends
        run: python asset_forge.py generator-backend-status
      - name: Inspect operational readiness
        run: python asset_forge.py operational-status
      - name: Inspect 3D toolchain
        run: python asset_forge.py 3d-toolchain-status
      - name: Validate engine handoff profiles
        run: python asset_forge.py validate-engine-profiles
      - name: Validate 3D and vector profiles
        run: python asset_forge.py validate-asset-profiles
      - name: Checkout star-list
        uses: actions/checkout@v4
        with:
          repository: dbrckk/star-list
          path: star-list
      - name: Validate runtime atlas example
        run: python asset_forge.py validate-runtime-atlas examples/runtime-atlas.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke-test web runtime atlas consumer
        run: node tests/runtime_atlas_web.test.mjs
      - name: Stress-test WebGL2 runtime atlas pipeline
        run: node benchmarks/runtime_atlas_web.bench.mjs
      - name: Smoke-test star-list bridge
        run: python asset_forge.py discover-tools star-list "pixel art sprites atlas" --top 3

  webp-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional WebP backend
        run: python -m pip install "Pillow>=12.2,<13"
      - name: Inspect raster backend
        run: python asset_forge.py raster-backend-status
      - name: WebP backend tests
        run: python -m unittest discover -s tests -p "test_raster_backend.py" -v


  vector-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install VTracer backend
        run: python -m pip install "Pillow>=12.2,<13" "vtracer>=0.6,<2"
      - name: VTracer backend smoke test
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from PIL import Image, ImageDraw
          from vector_backend import status, vectorize_raster

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              source = root / "source.png"
              output = root / "output.svg"
              image = Image.new("RGB", (64, 64), "white")
              draw = ImageDraw.Draw(image)
              draw.rectangle((8, 8, 56, 56), fill="black")
              draw.ellipse((20, 20, 44, 44), fill="red")
              image.save(source, format="PNG")
              result = vectorize_raster(source, output)
              assert status()["vectorizeReady"] is True
              assert result["backend"] == "vtracer"
              assert output.is_file() and output.stat().st_size > 0
              assert "<svg" in output.read_text(encoding="utf-8").lower()
          PY
