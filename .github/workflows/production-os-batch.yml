name: Production OS asset batch

run-name: Asset Forge batch ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Unique Production OS correlation id"
        required: true
        type: string
      spec_json:
        description: "Transactional asset batch specification"
        required: true
        type: string
      backend:
        description: "Generation backend"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - pollinations
          - qwen-colab
          - cloudflare
          - kaggle-qwen
          - vtracer
      model:
        description: "Optional model override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: asset-forge-batch-${{ inputs.correlation_id }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      GITHUB_TOKEN: ${{ github.token }}
      ASSET_FORGE_GITHUB_TOKEN: ${{ github.token }}
      ASSET_FORGE_GITHUB_REPOSITORY: ${{ github.repository }}
      ASSET_FORGE_BACKEND_HISTORY: .asset-forge/backend-history.json
    steps:
      - name: Checkout asset-forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore backend performance history
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .asset-forge/backend-history.json
          key: asset-forge-backend-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            asset-forge-backend-history-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Asset Forge
        run: |
          python -m pip install ".[generation]"
          python -m pip install -U kaggle

      - name: Install Pollinations CLI
        run: npm install --global @pollinations/cli@0.1.15

      - name: Authenticate Pollinations CLI
        if: env.POLLINATIONS_API_KEY != ''
        shell: bash
        run: printf '%s' "$POLLINATIONS_API_KEY" | polli auth login --with-token

      - name: Materialize batch spec
        env:
          SPEC_JSON: ${{ inputs.spec_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["SPEC_JSON"])
          Path("build/remote-batch").mkdir(parents=True, exist_ok=True)
          Path("build/remote-batch/spec.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute dependency-aware batch
        shell: bash
        run: |
          args=(
            python remote_batch.py
            --spec build/remote-batch/spec.json
            --output-root build/remote-batch/output
            --backend "${{ inputs.backend }}"
          )
          if [ -n "${{ inputs.model }}" ]; then
            args+=(--model "${{ inputs.model }}")
          fi
          "${args[@]}"

      - name: Validate batch result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/remote-batch/output").resolve()
          result = json.loads((root / "batch-result.json").read_text(encoding="utf-8"))
          assert result["schema_version"] == "asset-forge/remote-batch-result/v1"
          assert result["success"] is True
          assert result["count"] == len(result["items"])
          for item in result["items"]:
              artifact = (root / item["artifact"]).resolve()
              assert artifact.is_relative_to(root)
              assert artifact.is_file()
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Publish batch summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("build/remote-batch/output/batch-result.json").read_text(
                  encoding="utf-8"
              )
          )
          routing = (
              result.get("routing_summary")
              if isinstance(result.get("routing_summary"), dict)
              else {}
          )
          quality = (
              result.get("quality_summary")
              if isinstance(result.get("quality_summary"), dict)
              else {}
          )
          breaker = (
              routing.get("circuit_breaker")
              if isinstance(routing.get("circuit_breaker"), dict)
              else {}
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write("## Asset Forge batch\n\n")
              fh.write(f"- Assets: `{result.get('count')}`\n")
              fh.write(
                  f"- Fallbacks: `{routing.get('fallback_count', 0)}` "
                  f"across `{routing.get('items_with_fallback', 0)}` assets\n"
              )
              fh.write(
                  f"- Final backends: `{json.dumps(routing.get('final_backends', {}), sort_keys=True)}`\n"
              )
              fh.write(
                  f"- Circuit breaker: `{'open' if breaker.get('open') else 'closed'}`"
                  f" (override: `{breaker.get('override')}`)\n"
              )
              fh.write(f"- Quality checked: `{quality.get('checked', 0)}`\n")
              fh.write(f"- Regenerated: `{quality.get('regenerated', 0)}`\n")
              fh.write(f"- Minimum similarity: `{quality.get('minimum_score')}`\n")
          PY

      - name: Upload transactional batch bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asset-forge-batch-${{ inputs.correlation_id }}
          path: build/remote-batch/output
          if-no-files-found: error
          retention-days: 14
