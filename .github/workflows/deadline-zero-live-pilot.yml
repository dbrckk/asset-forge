name: Deadline Zero live visual pilot

# This can call a metered provider. Never auto-run on push or merge.
on:
  workflow_dispatch:
    inputs:
      approve_provider_usage:
        description: "I explicitly approve live image-generation quota/charges"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deadline-zero-live-visual-pilot
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Require explicit live-generation approval
        shell: bash
        env:
          APPROVED: ${{ inputs.approve_provider_usage }}
        run: |
          if [ "$APPROVED" != "true" ]; then
            echo "::error::Live image generation requires explicit manual approval."
            exit 2
          fi
      - name: Checkout asset-forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Asset Forge
        run: |
          python -m pip install ".[generation]"
          python -m pip install -U kaggle

      - name: Restore Asset Forge library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/asset-forge
          key: asset-forge-deadline-zero-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            asset-forge-deadline-zero-${{ runner.os }}-

      - name: Inspect production readiness
        run: asset-forge operational-status

      - name: Check live pilot credential
        id: credential
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "backend=cloudflare" >> "$GITHUB_OUTPUT"
            echo "credential=CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          elif [ -n "$KAGGLE_API_TOKEN" ] && [ -n "$KAGGLE_USERNAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "backend=kaggle-qwen" >> "$GITHUB_OUTPUT"
            echo "credential=KAGGLE_API_TOKEN/KAGGLE_USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deadline Zero live pilot requires Cloudflare Workers AI or Kaggle credentials."
          fi

      - name: Require a live backend for manual pilot
        if: github.event_name == 'workflow_dispatch' && steps.credential.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::error::Manual live visual pilot requires Cloudflare or Kaggle credentials."
          exit 2

      # Commercial references use licensed FLUX.2 Klein 4B on Cloudflare;
      # research-licensed Kaggle Qwen remains blocked before any image call.
      # This pilot is manual-only and requires explicit provider cost consent.
      - name: Preflight commercial model rights before generating assets
        if: steps.credential.outputs.ready == 'true'
        env:
          SELECTED_RASTER_BACKEND: ${{ steps.credential.outputs.backend }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          spec = json.loads(
              Path("examples/deadline-zero-live-pilot-batch.json").read_text(encoding="utf-8")
          )
          items = spec.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("Deadline Zero pilot spec has no items")
          backend = os.environ["SELECTED_RASTER_BACKEND"].strip()
          commercial = [
              item for item in items
              if isinstance(item, dict)
              and isinstance(item.get("request"), dict)
              and isinstance(item["request"].get("manifest"), dict)
              and item["request"]["manifest"].get("license", {}).get("commercialUse") is True
          ]
          has_references = any(item.get("depends_on") for item in commercial)
          blocked = bool(commercial) and backend != "cloudflare"
          if blocked:
              folder = Path("build/deadline-zero-live-pilot")
              folder.mkdir(parents=True, exist_ok=True)
              status = {
                  "schema_version": "asset-forge/live-pilot/v1",
                  "success": False,
                  "status": "commercial_model_license_unverified",
                  "backend": backend,
                  "affected_items": [str(item.get("id") or "") for item in commercial],
                  "generation_attempted": False,
              }
              (folder / "pilot-status.json").write_text(
                  json.dumps(status, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
              print("::error::Commercial reference pilot requires Cloudflare FLUX.2 Klein 4B, not unlicensed Qwen generation.")
              raise SystemExit(2)
          print("PASS: model-rights preflight allows selected pilot backend")
          PY

      - name: Produce Rex visual pilot
        if: steps.credential.outputs.ready == 'true'
        run: |
          backend="${{ steps.credential.outputs.backend }}"
          args=(--spec examples/deadline-zero-live-pilot-batch.json
                --output-root build/deadline-zero-live-pilot
                --backend "$backend")
          if [ "$backend" = "cloudflare" ]; then
            args+=(--model "@cf/black-forest-labs/flux-2-klein-4b")
          fi
          python remote_batch.py "${args[@]}"

      - name: Persist blocked pilot status
        if: steps.credential.outputs.ready != 'true'
        run: |
          mkdir -p build/deadline-zero-live-pilot
          printf '%s\n' '{"schema_version":"asset-forge/live-pilot/v1","success":false,"status":"credential_required","required_secret":"CLOUDFLARE_API_TOKEN+CLOUDFLARE_ACCOUNT_ID or KAGGLE_API_TOKEN+KAGGLE_USERNAME"}' > build/deadline-zero-live-pilot/pilot-status.json

      - name: Validate pilot bundle
        if: steps.credential.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/deadline-zero-live-pilot")
          result = json.loads((root / "batch-result.json").read_text(encoding="utf-8"))
          assert result["success"] is True
          assert result["execution_order"] == [
              "rex-pilot-anchor",
              "rex-pilot-run",
              "rex-pilot-attack",
          ]
          assert result["count"] == 3
          assert result["quality_summary"]["checked"] == 3
          assert result["quality_summary"]["minimum_score"] is not None
          for item in result["items"]:
              artifact = root / item["artifact"]
              assert artifact.is_file() and artifact.stat().st_size > 0
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Publish quality summary
        if: steps.credential.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("build/deadline-zero-live-pilot/batch-result.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fh:
              fh.write("## Deadline Zero live visual pilot\n\n")
              fh.write(f"- Produced: {result['count']} assets\n")
              fh.write(f"- Quality-checked: {result['quality_summary']['checked']} assets\n")
              fh.write(f"- Visual consistency checked: {result['quality_summary'].get('visual_checked', 0)} assets\n")
              fh.write(f"- Technical quality checked: {result['quality_summary'].get('technical_checked', 0)} assets\n")
              fh.write(f"- Regenerated: {result['quality_summary']['regenerated']}\n")
              fh.write(f"- Minimum quality score: {result['quality_summary']['minimum_score']}\n")
          PY

      - name: Upload live visual pilot
        if: always() && hashFiles('build/deadline-zero-live-pilot/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadline-zero-live-visual-pilot
          path: build/deadline-zero-live-pilot
          if-no-files-found: error
          retention-days: 14
