name: Deadline Zero live premium pilot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deadline-zero-live-pilot.yml"
      - "examples/deadline-zero-live-pilot-batch.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadline-zero-live-premium-pilot
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
    steps:
      - name: Checkout asset-forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Asset Forge
        run: python -m pip install ".[generation]"

      - name: Install Pollinations CLI
        run: npm install --global @pollinations/cli@0.1.15

      - name: Authenticate Pollinations CLI
        if: env.POLLINATIONS_API_KEY != ''
        shell: bash
        run: printf '%s' "$POLLINATIONS_API_KEY" | polli auth login --with-token

      - name: Inspect production readiness
        run: asset-forge operational-status

      - name: Check live pilot credential
        id: credential
        shell: bash
        run: |
          if [ -n "$POLLINATIONS_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "backend=pollinations" >> "$GITHUB_OUTPUT"
            echo "credential=POLLINATIONS_API_KEY" >> "$GITHUB_OUTPUT"
          elif [ -n "$CODEX_ACCESS_TOKEN" ] || [ -n "$CHATGPT_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "backend=imagen-codex" >> "$GITHUB_OUTPUT"
            echo "credential=CODEX_ACCESS_TOKEN/CHATGPT_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deadline Zero live pilot requires Pollinations or Imagen/Codex credentials."
          fi

      - name: Produce Rex premium pilot
        if: steps.credential.outputs.ready == 'true'
        run: |
          python remote_batch.py \
            --spec examples/deadline-zero-live-pilot-batch.json \
            --output-root build/deadline-zero-live-pilot \
            --backend "${{ steps.credential.outputs.backend }}"

      - name: Persist blocked pilot status
        if: steps.credential.outputs.ready != 'true'
        run: |
          mkdir -p build/deadline-zero-live-pilot
          printf '%s\n' '{"schema_version":"asset-forge/live-pilot/v1","success":false,"status":"credential_required","required_secret":"POLLINATIONS_API_KEY or CODEX_ACCESS_TOKEN/CHATGPT_ACCESS_TOKEN"}' > build/deadline-zero-live-pilot/pilot-status.json

      - name: Validate pilot bundle
        if: steps.credential.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/deadline-zero-live-pilot")
          result = json.loads((root / "batch-result.json").read_text(encoding="utf-8"))
          assert result["success"] is True
          assert result["execution_order"] == [
              "rex-pilot-anchor",
              "rex-pilot-run",
              "rex-pilot-attack",
          ]
          assert result["count"] == 3
          assert result["quality_summary"]["checked"] == 2
          assert result["quality_summary"]["minimum_score"] is not None
          for item in result["items"]:
              artifact = root / item["artifact"]
              assert artifact.is_file() and artifact.stat().st_size > 0
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Publish quality summary
        if: steps.credential.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("build/deadline-zero-live-pilot/batch-result.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fh:
              fh.write("## Deadline Zero live premium pilot\n\n")
              fh.write(f"- Produced: {result['count']} assets\n")
              fh.write(f"- Checked: {result['quality_summary']['checked']} dependent assets\n")
              fh.write(f"- Regenerated: {result['quality_summary']['regenerated']}\n")
              fh.write(f"- Minimum consistency score: {result['quality_summary']['minimum_score']}\n")
          PY

      - name: Upload live premium pilot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadline-zero-live-premium-pilot
          path: build/deadline-zero-live-pilot
          if-no-files-found: error
          retention-days: 14
