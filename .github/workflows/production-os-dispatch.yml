name: Production OS dispatch

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: "asset-forge/production-request/v1 JSON payload"
        required: true
        type: string
      backend:
        description: "Generation backend"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - pollinations
          - qwen-colab
          - cloudflare
      model:
        description: "Optional model override"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: asset-forge-production-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      ASSET_FORGE_GITHUB_TOKEN: ${{ github.token }}
      ASSET_FORGE_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout asset-forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Asset Forge
        run: python -m pip install ".[generation]"

      - name: Install Pollinations CLI
        run: npm install --global @pollinations/cli@0.1.15

      - name: Authenticate Pollinations CLI
        if: env.POLLINATIONS_API_KEY != ''
        shell: bash
        run: printf '%s' "$POLLINATIONS_API_KEY" | polli auth login --with-token

      - name: Materialize request
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["REQUEST_JSON"]
          request = json.loads(raw)
          Path("build").mkdir(exist_ok=True)
          Path("build/production-request.json").write_text(
              json.dumps(request, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Inspect readiness
        run: asset-forge operational-status

      - name: Fulfill production request
        shell: bash
        run: |
          args=(asset-forge fulfill build/production-request.json --backend "${{ inputs.backend }}")
          if [ -n "${{ inputs.model }}" ]; then
            args+=(--model "${{ inputs.model }}")
          fi
          "${args[@]}"

      - name: Locate and validate production report
        id: report
        shell: bash
        run: |
          report="$(find build/asset-forge -name production-report.json -type f -print -quit)"
          if [ -z "$report" ]; then
            echo "::error::No production-report.json was produced"
            exit 1
          fi
          asset-forge validate-production-report "$report"
          echo "path=$report" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$report")" >> "$GITHUB_OUTPUT"

      - name: Publish job summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write("## Asset Forge production\n\n")
              fh.write(f"- Request: `{report.get('requestId')}`\n")
              fh.write(f"- Asset: `{report.get('assetId')}`\n")
              fh.write(f"- Type: `{report.get('assetType')}`\n")
              fh.write(f"- Success: `{report.get('success')}`\n")
              fh.write(f"- Artifact: `{report.get('artifact')}`\n")
          PY
        env:
          REPORT_PATH: ${{ steps.report.outputs.path }}

      - name: Upload production output
        if: always() && steps.report.outputs.dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asset-forge-${{ github.run_id }}
          path: ${{ steps.report.outputs.dir }}
          if-no-files-found: error
          retention-days: 14
